      - name: Record End time
        id: end_time
        run: echo "workflow_end_time=$(date +%s)" >> $GITHUB_ENV


      - name: Calculate Total Duration
        id: total_duration
        run: |
          workflow_start_time=${{ env.workflow_start_time }}
          workflow_end_time=${{ env.workflow_end_time }}
          total_duration=$((workflow_end_time - workflow_start_time))
          if [ $total_duration -lt 60 ]; then
            total_duration_formatted="${total_duration}초"
          else
            total_minutes=$((total_duration / 60))
            total_seconds=$((total_duration % 60))
            total_duration_formatted="${total_minutes}분 ${total_seconds}초"
          fi
          echo "Total duration: $total_duration_formatted"
          echo "total_duration_formatted=$total_duration_formatted" >> $GITHUB_ENV
          echo "::set-output name=total_duration_formatted::$total_duration_formatted"          

  notify:
    runs-on: ubuntu-latest
    needs: build
    steps:

      - name: Checkout code for commit messages
        uses: actions/checkout@v4

      - name: Fetch Branch and Commit Messages
        id: fetch_info
        run: |
          # Extract branch name without prefix
          BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/^[^/]*\///')
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

          COMMIT_MESSAGE=$(git log -1 --pretty=%s ${{ github.sha }})
          COMMIT_DESCRIPTION=$(git log -1 --pretty=%b ${{ github.sha }})
          
         MODIFIED_COMMIT_DESCRIPTION=$(echo "$COMMIT_DESCRIPTION" | awk '{print NR ". " $0}')

          echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV
          echo "MODIFIED_COMMIT_DESCRIPTION=$MODIFIED_COMMIT_DESCRIPTION" >> $GITHUB_ENV


      - name: Send Build Status Slack Msg
        uses: 8398a7/action-slack@v3
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_PERSONAL_WEB_HOOK_URL }}
        with:
          status: custom
          custom_payload: |
            {
              "attachments": [
                {
                  "color": "${{ needs.build.result == 'success' && '#36a64f' || '#FF0000' }}",
                  "title": "AOS Release Build",
                  "fields": [
                    {
                      "title": "변경점",
                      "value": "`${{ env.COMMIT_MESSAGE }}`",
                      "short": false
                    },
                    {
                      "title": "커밋 설명",
                      "value": "`${{ env.MODIFIED_COMMIT_DESCRIPTION }}`",
                      "short": false
                    },
                    {
                      "title": "다운로드 주소",
                      "value": "<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}>",
                      "short": false
                    },
                    {
                      "title": "브랜치",
                      "value": "`${{ env.BRANCH_NAME }}`",
                      "short": true
                    },
                    {
                      "title": "이벤트 이름",
                      "value": "_${{ github.event_name }}_",
                      "short": true
                    },
                    {
                      "title": "작성자",
                      "value": "*${{ github.event.head_commit.author.name }}*",
                      "short": true
                    },
                    {
                      "title": "담당자",
                      "value": "abc",
                      "short": false
                    },
                    {
                      "title": "변경점",
                      "value": "`${{ needs.build.total_duration.outputs.total_duration_formatted}}`",
                      "short": false
                    }
                  ],
                  "footer": "Build Notification",
                  "footer_icon": "https://cdn-icons-png.flaticon.com/512/226/226770.png"
                }
              ]
            }
        if: ${{ needs.build.result == 'success' }}
