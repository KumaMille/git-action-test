jobs:
  check-description:
    runs-on: [self-hosted]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch Branch and Commit Messages
        id: fetch_info
        run: |
          COMMIT_MESSAGE=$(git log -1 --pretty=%s ${{ github.sha }})
          COMMIT_DESCRIPTION=$(git log -1 --pretty=%b ${{ github.sha }})

          echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV
      - name: Output environment variable
        run: |
          echo "Job1에서 설정된 값: ${{env.COMMIT_MESSAGE}}"
#          echo "Job1에서 설정된 값: ${{env.COMMIT_DESCRIPTION}}"

  build:
    runs-on: self-hosted
    needs: check-description
    env:
      COMMIT_DESCRIPTION: ${{ vars.COMMIT_DESCRIPTION }}
    strategy:
      max-parallel: 5
      matrix:
        task:
          - assembleGoogleDistributionRelease
#          - assembleGoogleSandboxRelease
#          - assembleGoogleQaRelease
#          - assembleSamsungDistributionRelease
#          - assembleSamsungSandboxRelease
#          - assembleSamsungQaRelease
#          - assembleOnestoreDistributionRelease
#          - assembleOnestoreSandboxRelease
#          - assembleOnestoreQaRelease

    steps:
      - uses: actions/checkout@v4

      - name: Check commit message
        id: check_commit
        run: |
          echo "job1에서 설정된 값 ${{env.COMMIT_DESCRIPTION}}"

          if git log -1 --pretty=%B | grep -q "description"; then
            echo "description=true" >> $GITHUB_ENV
          else
            echo "description=false" >> $GITHUB_ENV
          fi

      - name: Set output for next workflow
        if: env.description == 'true'
        run: |
          echo "description=true" >> $GITHUB_ENV

      - name: Record Start Time
        id: start_time
        run: echo "workflow_start_time=$(date +%s)" >> $GITHUB_ENV

      - name: Set Build Number
        id: set_build_number
        run: echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV


      - name: Set up JDK 17
        run: |
          export JAVA_HOME=/opt/homebrew/Cellar/openjdk@17/17.0.7/libexec/openjdk.jdk/Contents/Home
          export PATH=$JAVA_HOME/bin:$PATH
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH

      - name: Verify Java version
        run: java -version

      - name: Grant Execute Permission For Gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$HOME/AndroidSDK" > $GITHUB_WORKSPACE/local.properties

